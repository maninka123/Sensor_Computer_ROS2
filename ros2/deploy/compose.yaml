# Alternative manual Docker Compose deployment. Do not run alongside systemd.
services:
  sensor:
    image: sensor-computer:jazzy-sdk
    container_name: sensor-computer-jazzy
    network_mode: host
    user: "1001:1001"
    init: true
    env_file: [runtime.env]
    environment:
      HOME: /home/rock
    volumes:
      - ../..:/workspace:ro
      - ../state/home:/home/rock
    working_dir: /home/rock
    command: [bash, /workspace/ros2/tools/container-entrypoint.sh]
    read_only: true
    tmpfs: [/tmp:size=268435456, /run:size=16777216]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 5g
    memswap_limit: 6g
    pids_limit: 512
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: "no"
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
